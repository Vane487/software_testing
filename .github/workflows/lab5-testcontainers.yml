name: Lab 5 Testcontainers

on:
  push:
    paths:
      - "lab5/**"
      - ".github/workflows/lab5-testcontainers.yml"
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: lab5/pom.xml

      - name: Run containerized integration test suite
        run: mvn -B test
